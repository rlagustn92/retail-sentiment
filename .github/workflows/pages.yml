# GitHub Pages(정적 페이지) 만들기: keeper(수집 순환)가 수집할 때마다 불러요. Actions 탭에서 수동 실행도 돼요.
# 주소: https://rlagustn92.github.io/retail-sentiment/
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # 더 새로운 데이터로 다시 만들 거라 앞의 것은 멈춰도 돼요

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-collector.txt "altair>=5.2"

      - name: data 브랜치 가져오기
        run: git clone --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" data

      - name: 섹터 수급 캐시 (네이버를 너무 자주 부르지 않게)
        uses: actions/cache@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      - name: 페이지 만들기
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python site_build.py --data data --out site --cache .cache

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
