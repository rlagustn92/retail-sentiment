name: check-keys
# 키 점검: FRED·KRX 키가 실제로 되는지 (키 값은 출력 안 해요)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/check_keys.py
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          KRX_KEY: ${{ secrets.KRX_KEY }}
